name: Deploy Migration Cutover (Core + DepositManager)

on:
  workflow_dispatch:

jobs:
  generate-summary:
    name: Diff Summary Generator
    runs-on: ubuntu-latest
    outputs:
      image_misc: ${{ steps.image-name.outputs.image_misc }}
      image_hot_path: ${{ steps.image-name.outputs.image_hot_path }}

    permissions:
      contents: "read"
      actions: read

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Security Check
        uses: x10xchange/gemini-pr-check@v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          custom_prompt: |
            You are an expert Smart Contract Auditor and Web3 Security Engineer.
            Analyze the following git diff for a smart contract deployment/update.
            Your primary goal is to identify **security vulnerabilities**, **logic flaws**, and **gas inefficiencies** introduced or modified by these changes. Smart contract bugs can lead to catastrophic loss of funds, so treat security with the absolute highest priority.
            You should use the tools provided to you to understand the changes and their impact on the wider protocol. 
            Please provide output in **GitHub Flavored Markdown**.
            Use emojis (e.g., 🚨, ⚠️, ⛽, 🟢) to make it visually scannable.
            Include the following sections:
            1. **Executive Summary**: A concise overview of the protocol changes and their purpose.
            2. **Critical Security Analysis** (Zero Tolerance):
              - 🚨 **High/Critical Risk**: (e.g., Reentrancy, broken access control, flash loan vulnerabilities, unchecked external calls, unsafe math/precision loss).
              - ⚠️ **Medium/Low Risk**: (e.g., Missing zero-address checks, front-running possibilities, logic bugs that don't directly drain funds, centralization risks).
            3. **Gas & Optimization**:
              - ⛽ **Inefficiencies**: (e.g., Unnecessary storage reads/writes, suboptimal loops, unused variables).
            4. **Technical Change Log**:
              - 🔄 **Logic Changes**: (Core protocol modifications, interface updates).
              - 🟢 **Safe Changes**: (NatSpec/Documentation updates, refactoring without logic changes).
            **Important Audit Guidelines:**
            - If you see state variables being updated *after* external calls, flag it immediately (CEI pattern violation).
            - Check if newly added functions have the correct visibility and access modifiers (e.g., `onlyOwner`).
            - Verify that mathematical operations handle precision correctly and are safe from underflow/overflow (if applicable to the compiler version).
            If you choose not to request files before and after the diff, please explain your reasoning after the technical change log. 
            If you chose to request files, please explain why you needed to request them. This helps improve the tooling.
            Please also summarize the use of the grep functionality—whether it was useful or if you encountered any issues using it.

  CI:
    needs: generate-summary
    runs-on: ubuntu-latest
    environment: starknet-prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install asdf & tools
        uses: asdf-vm/actions/install@v4

      - name: Install Voyager Verifier
        run: |
          asdf plugin add voyager https://github.com/NethermindEth/asdf-voyager-verifier.git
          asdf install voyager 1.2.4
          asdf set -u voyager 1.2.4

      - name: install starkli
        run: |
          curl https://get.starkli.sh | sh
          . /home/runner/.config/.starkli/env
          starkliup

      - name: Retrieve account info
        run: |
          # . /home/runner/.config/.starkli/env
          # starkli account fetch --rpc ${{ secrets.RPC_V8 }} --output deployer_account.json 0x785932b867b6a21dfd64367edd181c1cfa83fa7ce942d005857cd5935049d58
          # address=$(cat deployer_account.json | jq -r .deployment.address)
          # echo address=$address
          sncast account import --name mainnet --address 0x0785932b867b6a21dfd64367edd181c1cfa83fa7ce942d005857cd5935049d58 --private-key ${{ secrets.DEPLOYER_KEY }} --type oz -u ${{ secrets.RPC_V9 }}

      - name: Declare Core and DepositManager
        id: deploy_contracts
        env:
          RPC_URL: ${{ secrets.RPC_V9 }}
        run: |
          set -euo pipefail
          HEX_HASH='.class_hash | select(type == "string" and test("^0x[0-9a-fA-F]+$"))'

          # Declares $1 and prints its class hash. A class that is already declared on
          # mainnet (e.g. on a re-run) is accepted, using the locally computed hash.
          declare_contract() {
            local name="$1" out="$2"
            local expected
            expected=$(sncast --json utils class-hash --contract-name "$name" --package perpetuals \
              | jq -Rer "fromjson? | select(.class_hash?) | $HEX_HASH")
            if sncast --account mainnet --wait --json declare \
              --url "$RPC_URL" --contract-name "$name" --package perpetuals > "$out" 2>&1; then
              cat "$out" >&2
              local declared
              # The file also holds stderr (scarb warnings), so skip non-JSON lines.
              declared=$(jq -Rer "fromjson? | select(.class_hash?) | $HEX_HASH" "$out")
              if [ "$declared" != "$expected" ]; then
                echo "$name declared hash $declared != computed hash $expected" >&2
                exit 1
              fi
            elif grep -qi 'already declared' "$out"; then
              cat "$out" >&2
              echo "$name is already declared: $expected" >&2
            else
              cat "$out" >&2
              exit 1
            fi
            echo "$expected"
          }

          CORE_HASH=$(declare_contract Core core-declaration.json)
          echo "core_class_hash=$CORE_HASH" >> "$GITHUB_OUTPUT"
          DEPOSIT_COMPONENT_HASH=$(declare_contract DepositManager deposit-manager-declaration.json)
          echo "deposit_class_hash=$DEPOSIT_COMPONENT_HASH" >> "$GITHUB_OUTPUT"

      - name: Print wallet upgrade details
        env:
          CORE_HASH: ${{ steps.deploy_contracts.outputs.core_class_hash }}
          DEPOSIT_COMPONENT_HASH: ${{ steps.deploy_contracts.outputs.deposit_class_hash }}
          CORE_ADDRESS: '0x05F062C924EcD9f5d4C74c567A28cc5502332fcf21828687EC20581a03F7E1C8'
        run: |
          set -euo pipefail
          # ASCII felt for DEPOSITS; the component is a class used via library calls.
          COMPONENT_TYPE=0x4445504f53495453
          # ImplementationData { impl_hash, eic_data: None, final: false } -> [hash, 1, 0].
          jq -n --arg core "$CORE_ADDRESS" --arg core_hash "$CORE_HASH" \
            --arg deposit_hash "$DEPOSIT_COMPONENT_HASH" --arg component "$COMPONENT_TYPE" '{
              network: "mainnet",
              core: {
                class_hash: $core_hash,
                add_new_implementation: {
                  contractAddress: $core,
                  entrypoint: "add_new_implementation",
                  calldata: [$core_hash, "1", "0"]
                },
                replace_to: {
                  contractAddress: $core,
                  entrypoint: "replace_to",
                  calldata: [$core_hash, "1", "0"]
                }
              },
              deposit_manager: {
                class_hash: $deposit_hash,
                registration: {
                  contractAddress: $core,
                  entrypoint: "register_external_component",
                  calldata: [$component, $deposit_hash]
                },
                activation: {
                  contractAddress: $core,
                  entrypoint: "activate_external_component",
                  calldata: [$component, $deposit_hash]
                }
              }
            }' > cutover-upgrade.json
          {
            echo '## Migration cutover: wallet upgrade'
            echo
            echo "Network: Starknet mainnet"
            echo "Core contract: $CORE_ADDRESS"
            echo "Core class hash: $CORE_HASH"
            echo "DepositManager class hash: $DEPOSIT_COMPONENT_HASH"
            echo "Component type (DEPOSITS): $COMPONENT_TYPE"
            echo
            echo 'Use a wallet with the upgrade-governor role. The Core upgrade and the DepositManager'
            echo 'component are independent; each has its own delay between its two calls.'
            echo
            echo '### Core (adds sweep_treasury)'
            echo "1. add_new_implementation calldata: $CORE_HASH 1 0"
            echo "2. After the upgrade delay from ImplementationAdded, replace_to calldata: $CORE_HASH 1 0"
            echo
            echo '### DepositManager (blocks new deposits)'
            echo "1. register_external_component calldata: $COMPONENT_TYPE $DEPOSIT_COMPONENT_HASH"
            echo "2. After the activation_time from ExternalComponentImplRegistered, activate_external_component calldata: $COMPONENT_TYPE $DEPOSIT_COMPONENT_HASH"
            echo 'New deposits stop only when activation succeeds; pending deposits can still be processed or refunded.'
            echo
            echo '### Before calling sweep_treasury'
            echo 'The treasury protection limit applies. For USDC, USDT, ETH and wBTC the treasury app governor must'
            echo 'request_protection_limit_percent_change(token, 100), wait for the timelock, apply it, then reset_protection_limit.'
            echo
            echo '```json'
            cat cutover-upgrade.json
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload wallet upgrade details
        uses: actions/upload-artifact@v4
        with:
          name: migration-cutover-upgrade
          path: |
            core-declaration.json
            deposit-manager-declaration.json
            cutover-upgrade.json

      - name: Verify Core and DepositManager
        env:
          CORE_HASH: ${{ steps.deploy_contracts.outputs.core_class_hash }}
          DEPOSIT_COMPONENT_HASH: ${{ steps.deploy_contracts.outputs.deposit_class_hash }}
        run: |
          voyager verify --network mainnet --class-hash "$CORE_HASH" \
            --contract-name Core --license Apache-2.0 --package perpetuals \
            --watch --lock-file || echo "Core verification might have failed: https://voyager.online/class/$CORE_HASH"
          voyager verify --network mainnet --class-hash "$DEPOSIT_COMPONENT_HASH" \
            --contract-name DepositManager --license Apache-2.0 --package perpetuals \
            --watch --lock-file || echo "DepositManager verification might have failed: https://voyager.online/class/$DEPOSIT_COMPONENT_HASH"
